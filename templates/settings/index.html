{% extends "base.html" %}
{% block title %}Business Settings{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">🏢 Business Settings</h1>
    
    <form method="POST" class="bg-white p-6 rounded-lg shadow space-y-4">
        <div>
            <label class="block text-sm font-medium">Company Name</label>
            <input type="text" name="company_name" value="{{ settings.company_name }}" class="w-full border rounded p-2">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium">Phone 1</label>
                <input type="text" name="phone_1" value="{{ settings.phone_1 }}" class="w-full border rounded p-2">
            </div>
            <div>
                <label class="block text-sm font-medium">Phone 2</label>
                <input type="text" name="phone_2" value="{{ settings.phone_2 }}" class="w-full border rounded p-2">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium">Email</label>
            <input type="email" name="email" value="{{ settings.email }}" class="w-full border rounded p-2">
        </div>
        <div>
            <label class="block text-sm font-medium">Website</label>
            <input type="text" name="website" value="{{ settings.website }}" class="w-full border rounded p-2">
        </div>
        <div>
            <label class="block text-sm font-medium">Address</label>
            <textarea name="address" rows="3" class="w-full border rounded p-2">{{ settings.address }}</textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium">NTN</label>
                <input type="text" name="ntn" value="{{ settings.ntn }}" class="w-full border rounded p-2">
            </div>
            <div>
                <label class="block text-sm font-medium">STRN</label>
                <input type="text" name="strn" value="{{ settings.strn }}" class="w-full border rounded p-2">
            </div>
        </div>
        
        <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700">💾 Save Settings</button>
    </form>
</div>
{% endblock %}
